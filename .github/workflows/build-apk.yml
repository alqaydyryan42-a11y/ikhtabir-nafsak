name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: stable
      - name: Write project
        run: |
          cat > pubspec.yaml << 'EOF'
          name: ikhtabir_nafsak
          description: تطبيق اختبر نفسك
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
          flutter:
            uses-material-design: true
          EOF
          mkdir -p lib
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          void main() => runApp(const App());
          class App extends StatelessWidget {
            const App({super.key});
            @override
            Widget build(BuildContext c) => MaterialApp(
              title: 'اختبر نفسك',
              debugShowCheckedModeBanner: false,
              theme: ThemeData(
                brightness: Brightness.dark,
                scaffoldBackgroundColor: const Color(0xFF0B1E3D),
                colorScheme: const ColorScheme.dark(
                  primary: Color(0xFF2D7FF9),
                  secondary: Color(0xFF7B5CFF),
                ),
                appBarTheme: const AppBarTheme(
                  backgroundColor: Color(0xFF0B1E3D),
                  foregroundColor: Color(0xFFF0F4FF),
                  centerTitle: true,
                ),
              ),
              builder: (ctx, child) => Directionality(
                textDirection: TextDirection.rtl,
                child: child!,
              ),
              home: const Home(),
            );
          }
          class Home extends StatelessWidget {
            const Home({super.key});
            @override
            Widget build(BuildContext c) => Scaffold(
              appBar: AppBar(title: const Text('اختبر نفسك')),
              body: Center(
                child: Padding(
                  padding: const EdgeInsets.all(24),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Container(
                        width: 120, height: 120,
                        decoration: BoxDecoration(
                          shape: BoxShape.circle,
                          gradient: const LinearGradient(
                            colors: [Color(0xFF2D7FF9), Color(0xFF7B5CFF)],
                          ),
                        ),
                        child: const Icon(Icons.quiz_rounded, size: 64, color: Colors.white),
                      ),
                      const SizedBox(height: 24),
                      const Text('اختبر نفسك',
                        style: TextStyle(fontSize: 32, fontWeight: FontWeight.bold, color: Colors.white)),
                      const SizedBox(height: 8),
                      const Text('اختبر فهمك بطريقة ذكية',
                        style: TextStyle(fontSize: 16, color: Color(0xFFA8B8D8))),
                      const SizedBox(height: 32),
                      ElevatedButton.icon(
                        onPressed: () {
                          ScaffoldMessenger.of(c).showSnackBar(
                            const SnackBar(content: Text('التطبيق يعمل! 🎉')),
                          );
                        },
                        icon: const Icon(Icons.play_arrow),
                        label: const Text('ابدأ'),
                      ),
                    ],
                  ),
                ),
              ),
            );
          }
          EOF
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
